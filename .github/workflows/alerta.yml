name: Notificacion DevOps

on:
  push:
    branches:
      - main

jobs:
  test-y-alerta:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar prueba unitaria
        run: node test_app.js

      - name: Enviar notificacion a ntfy
        run: |
          curl -H "Title: Push exitoso" \
               -H "Priority: high" \
               -d "Hola Mundo ejecutado correctamente y prueba unitaria aprobada." \
               https://ntfy.sh/devops-itla
