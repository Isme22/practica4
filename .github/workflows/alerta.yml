name: Notificacion DevOps

on:
  push:
    branches:
      - main

jobs:
  enviar-alerta:
    runs-on: ubuntu-latest

    steps:
      - name: Enviar notificacion a ntfy
        run: |
          curl -H "Title: Nuevo Push en GitHub" \
               -H "Priority: high" \
               -d "Se realizó un push a la rama main del repositorio." \
               https://ntfy.sh/devops-itla